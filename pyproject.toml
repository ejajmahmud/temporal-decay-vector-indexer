[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-decay-vector-indexer"
version = "0.1.0"
description = "Time-weighted vector search index that discounts relevance of stale factual documents in dynamic fast-moving codebases"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
temporal-decay-vector-indexer = "temporal_decay_vector_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["temporal_decay_vector_indexer*"]
